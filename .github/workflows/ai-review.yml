name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff
        id: diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/pr.diff
          echo "lines=$(wc -l < /tmp/pr.diff)" >> "$GITHUB_OUTPUT"
      - name: Post heuristic review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/pr.diff', 'utf8');
            const findings = [];
            if (/SECRET_KEY\s*=\s*['\"](?!change-me|ci-secret|test)/i.test(diff)) findings.push('Possible hard-coded secret');
            if (/localStorage\.setItem\(.*token/i.test(diff)) findings.push('Avoid storing tokens in localStorage');
            if (/password.*=.*request\.(GET|data)/i.test(diff) && !/validate_password/.test(diff)) findings.push('Check password validation');
            if (diff.includes('eval(')) findings.push('Avoid eval');
            const body = findings.length
              ? `## AI review (heuristic)\n\n${findings.map(f => `- [ ] ${f}`).join('\n')}\n\nModel note: Cursor Grok 4.5 used in development. Configure \`OPENAI_API_KEY\` secret for deeper LLM review later.`
              : `## AI review (heuristic)\n\nNo high-risk patterns detected in diff (${{ steps.diff.outputs.lines }} lines).\n\nStill verify: ownership checks, cookie auth, coverage gate, no FE business logic.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
