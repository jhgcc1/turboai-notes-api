name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "true"
      SECRET_KEY: ci-secret-key-at-least-32-characters-long
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff format
        run: ruff format --check apps config observability
      - name: Ruff lint
        run: ruff check apps config observability
      # The Lambda is excluded: it imports `triage.*` as it does inside the zip,
      # which does not resolve from the repository root.
      - name: Mypy
        run: mypy apps config || true
      # Fail if models changed without a committed migration (SQLite CI DB only).
      - name: Migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Unit tests (100% coverage)
        run: pytest
